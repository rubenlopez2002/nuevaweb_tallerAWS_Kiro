<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bingo</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main>
    <h1>🎱 Bingo</h1>

    <section class="stage">
      <div id="drum" class="drum" aria-hidden="true"><div id="cage" class="cage"></div></div>
      <div id="ball" class="ball" aria-live="polite">?</div>
      <p id="status">Pulsa «Automático» y salen solos</p>
      <div class="buttons">
        <button id="auto">▶ Automático</button>
        <button id="draw">Sacar número</button>
        <button id="voice">🔊 Voz: sí</button>
        <button id="reset" class="secondary">Nuevo juego</button>
      </div>
      <p class="count">Salieron <span id="count">0</span> de 90</p>
      <p id="voices" class="voices">🎙️ Voz de hombre: 🇪🇸 Pablo · 🇬🇧 David · 🇫🇷 Paul · 🇩🇪 Stefan</p>
    </section>

    <section>
      <h2>Tablero</h2>
      <div id="board" class="board"></div>
    </section>

    <section>
      <h2>Números que ya salieron</h2>
      <div id="history" class="history"></div>
    </section>
  </main>
  <footer class="version">Bingo v0.1.4</footer>
  <script src="script.js?v=4"></script>
</body>
</html>
